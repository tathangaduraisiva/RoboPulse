<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoboPulse | Industrial Fleet Monitoring & Telemetry</title>
    <meta name="description" content="Industrial robotic fleet health monitoring, real-time sensor telemetry, and predictive maintenance console." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      html[data-theme="dark"], html.dark, html[data-theme="dark"] body {
        background-color: #0b0f19 !important;
        color-scheme: dark;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f8fafc !important;
        color-scheme: light;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('robopulse-theme') || localStorage.getItem('robopulse_theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0b0f19';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
