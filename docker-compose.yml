services:

  postgres:
    image: postgres:16-alpine
    container_name: robopulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: robopulse
      POSTGRES_USER: robopulse_user
      POSTGRES_PASSWORD: robopulse_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: robopulse-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
